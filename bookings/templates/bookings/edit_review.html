{% extends "base.html" %}

{% block content %}

<div class="max-w-xl mx-auto py-20">

  <h2 class="text-2xl font-bold mb-6">Edit Review</h2>

  <form method="POST">
    {% csrf_token %}

    <input type="number" name="rating" value="{{ review.rating }}"
           min="1" max="5"
           class="border p-2 w-full mb-4">

    <textarea name="comment"
      class="border p-2 w-full mb-4">{{ review.comment }}</textarea>

    <button class="bg-orange-600 text-white px-4 py-2 rounded">
      Update
    </button>

  </form>

</div>

{% endblock %}
